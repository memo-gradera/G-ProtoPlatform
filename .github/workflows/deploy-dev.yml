# Manual dev deployment: validate, build, push API container, deploy frontend SWA.
#
# Required GitHub secrets:
#   AZURE_STATIC_WEB_APPS_API_TOKEN — Static Web App deployment token
#   AZURE_WEBAPP_PUBLISH_PROFILE — App Service publish profile for SCM restart (Download publish profile)
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN — Docker Hub push (memogradera/gradera-api)
#   DATABASE_URL — optional; required when run_migrations is enabled
#
# Required GitHub variables (dev environment):
#   VITE_AZURE_TENANT_ID, VITE_AZURE_CLIENT_ID, VITE_API_SCOPE, VITE_API_BASE_URL

name: Deploy Dev

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Run Prisma migrate deploy before API deployment
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  DOCKER_IMAGE: memogradera/gradera-api

jobs:
  deploy-dev:
    name: Deploy to Azure (dev)
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build domain package
        run: |
          rm -rf packages/domain/dist packages/domain/tsconfig.build.tsbuildinfo
          pnpm --filter @proto-platform/domain build

      - name: Generate Prisma Client
        run: pnpm --filter gradera-api exec prisma generate

      - name: Test web app
        run: pnpm --filter gradera-innovation-hub test

      - name: Test API
        run: pnpm --filter gradera-api test

      - name: Build domain package for API
        run: pnpm --filter @proto-platform/domain build

      - name: Generate Prisma Client for API build
        run: pnpm --filter gradera-api exec prisma generate

      - name: Build API
        run: pnpm --filter gradera-api build

      - name: Build web app
        env:
          VITE_AUTH_PROVIDER: msal
          VITE_BACKEND_PROVIDER: api
          VITE_DEV_AUTH_BYPASS: "false"
          VITE_DEV_DATA_BYPASS: "false"
          VITE_AZURE_TENANT_ID: ${{ vars.VITE_AZURE_TENANT_ID }}
          VITE_AZURE_CLIENT_ID: ${{ vars.VITE_AZURE_CLIENT_ID }}
          VITE_API_SCOPE: ${{ vars.VITE_API_SCOPE }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: pnpm --filter gradera-innovation-hub build

      - name: Copy Static Web App config into build output
        run: cp apps/web/staticwebapp.config.json apps/web/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run database migrations
        if: inputs.run_migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter gradera-api exec prisma migrate deploy

      - name: Restart Azure App Service via SCM
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          set -euo pipefail

          PROFILE_FILE="$(mktemp)"
          SCM_USER_FILE="$(mktemp)"
          SCM_PASS_FILE="$(mktemp)"
          trap 'rm -f "$PROFILE_FILE" "$SCM_USER_FILE" "$SCM_PASS_FILE"' EXIT

          printf '%s' "$AZURE_WEBAPP_PUBLISH_PROFILE" > "$PROFILE_FILE"

          SCM_HOST="$(
            python3 - "$PROFILE_FILE" "$SCM_USER_FILE" "$SCM_PASS_FILE" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          profile_path, user_path, pass_path = sys.argv[1:4]
          root = ET.parse(profile_path).getroot()
          profiles = root.findall("publishProfile")

          selected = None
          for profile in profiles:
              method = profile.get("publishMethod", "")
              url = profile.get("publishUrl", "")
              if method == "MSDeploy":
                  selected = profile
                  break
              if ".scm." in url and selected is None:
                  selected = profile

          if selected is None and profiles:
              selected = profiles[0]

          if selected is None:
              raise SystemExit("ERROR: No publish profile entry found in publish profile XML")

          publish_url = selected.get("publishUrl", "")
          username = selected.get("userName", "")
          password = selected.get("userPWD", "")

          if not publish_url or not username or not password:
              raise SystemExit(
                  "ERROR: publish profile missing publishUrl, userName, or userPWD"
              )

          Path(user_path).write_text(username)
          Path(pass_path).write_text(password)

          host = publish_url.split(":")[0]
          print(host)
          PY
          )"

          SCM_URL="https://${SCM_HOST}"
          SCM_USER="$(cat "$SCM_USER_FILE")"
          SCM_PASS="$(cat "$SCM_PASS_FILE")"

          restart_via_scm() {
            local endpoint="$1"
            local response http_code body

            response="$(
              curl --silent --show-error --write-out $'\n%{http_code}' \
                -X POST \
                -u "${SCM_USER}:${SCM_PASS}" \
                "${SCM_URL}${endpoint}"
            )"
            http_code="${response##*$'\n'}"
            body="${response%$'\n'*}"

            echo "SCM POST ${endpoint} -> HTTP ${http_code}"
            if [ -n "$body" ]; then
              echo "$body"
            fi

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              return 0
            fi
            return 1
          }

          if restart_via_scm "/api/app/restart"; then
            echo "App Service restart succeeded."
          elif restart_via_scm "/api/processes/-1"; then
            echo "App Service process restart succeeded."
          else
            echo "ERROR: Failed to restart App Service via SCM (${SCM_URL})."
            exit 1
          fi

      - name: Verify API health endpoint
        run: |
          API_BASE_URL="${{ vars.VITE_API_BASE_URL }}"
          API_BASE_URL="${API_BASE_URL%/}"
          HEALTH_URL="${API_BASE_URL%/api}/health"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "$HEALTH_URL"; then
              echo ""
              echo "Health check passed."
              exit 0
            fi
            echo "Health check attempt ${attempt} failed; retrying in 15s..."
            sleep 15
          done
          echo "Health check failed after retries: $HEALTH_URL"
          exit 1

      - name: Debug dist artifact
        run: |
          echo "Dist file count:"
          find apps/web/dist -type f | wc -l
          echo "Dist size:"
          du -sh apps/web/dist

      - name: Deploy web to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/web/dist
          output_location: ''
          skip_app_build: true

# Build API Docker image (linux/amd64), push to Docker Hub, and restart Azure Web App.
# Target: gradera-innovationhub-dev-api → memogradera/gradera-api
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME        — Docker Hub username (e.g. memogradera)
#   DOCKERHUB_TOKEN           — Docker Hub access token (read/write; not account password)
#   AZURE_CLIENT_ID           — Entra app registration client ID for GitHub Actions OIDC
#   AZURE_TENANT_ID           — Microsoft Entra directory (tenant) ID
#   AZURE_SUBSCRIPTION_ID     — Azure subscription ID
#
# Required GitHub variables (repository or "dev" environment):
#   AZURE_RESOURCE_GROUP      — Resource group for the API Web App (e.g. gradera-innovationhub-dev-rg)
#
# App Service must already be configured to pull memogradera/gradera-api from Docker Hub.
# For private images, set DOCKER_REGISTRY_SERVER_USERNAME / DOCKER_REGISTRY_SERVER_PASSWORD
# on the Web App (Portal → Configuration → Application settings).

name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.dockerignore'

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  DOCKER_IMAGE: memogradera/gradera-api
  AZURE_WEBAPP_NAME: gradera-innovationhub-dev-api

jobs:
  deploy-api:
    name: Build, push, and restart API
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point Web App at new image tag
        run: |
          az webapp config container set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --docker-custom-image-name "${{ env.DOCKER_IMAGE }}:${{ github.sha }}" \
            --docker-registry-server-url "https://index.docker.io"

      - name: Restart Azure Web App
        run: |
          az webapp restart \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}"

      - name: Verify health endpoint
        run: |
          HEALTH_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "$HEALTH_URL"; then
              echo ""
              echo "Health check passed."
              exit 0
            fi
            echo "Health check attempt ${attempt} failed; retrying in 15s..."
            sleep 15
          done
          echo "Health check failed after retries: $HEALTH_URL"
          exit 1

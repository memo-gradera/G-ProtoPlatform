# Manual dev deployment: validate, build, push API container, deploy frontend SWA.
#
# Required GitHub secrets:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID — Azure OIDC
#   AZURE_STATIC_WEB_APPS_API_TOKEN — Static Web App deployment token
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN — Docker Hub push (memogradera/gradera-api)
#   DATABASE_URL — optional; required when run_migrations is enabled
#
# Required GitHub variables (dev environment):
#   VITE_AZURE_TENANT_ID, VITE_AZURE_CLIENT_ID, VITE_API_SCOPE, VITE_API_BASE_URL
#   AZURE_RESOURCE_GROUP — e.g. gradera-innovationhub-dev-rg

name: Deploy Dev

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Run Prisma migrate deploy before API deployment
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: "22"
  DOCKER_IMAGE: memogradera/gradera-api
  AZURE_WEBAPP_NAME: gradera-innovationhub-dev-api

jobs:
  deploy-dev:
    name: Deploy to Azure (dev)
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build domain package
        run: pnpm --filter @proto-platform/domain build

      - name: Test web app
        run: pnpm --filter gradera-innovation-hub test

      - name: Test API
        run: pnpm --filter gradera-api test

      - name: Build API
        run: pnpm --filter gradera-api build

      - name: Build web app
        env:
          VITE_AUTH_PROVIDER: msal
          VITE_BACKEND_PROVIDER: api
          VITE_DEV_AUTH_BYPASS: "false"
          VITE_DEV_DATA_BYPASS: "false"
          VITE_AZURE_TENANT_ID: ${{ vars.VITE_AZURE_TENANT_ID }}
          VITE_AZURE_CLIENT_ID: ${{ vars.VITE_AZURE_CLIENT_ID }}
          VITE_API_SCOPE: ${{ vars.VITE_API_SCOPE }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: pnpm --filter gradera-innovation-hub build

      - name: Copy Static Web App config into build output
        run: cp apps/web/staticwebapp.config.json apps/web/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run database migrations
        if: inputs.run_migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter gradera-api exec prisma migrate deploy

      - name: Point Web App at new image tag
        run: |
          az webapp config container set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --docker-custom-image-name "${{ env.DOCKER_IMAGE }}:${{ github.sha }}" \
            --docker-registry-server-url "https://index.docker.io"

      - name: Restart Azure Web App
        run: |
          az webapp restart \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}"

      - name: Verify API health endpoint
        run: |
          HEALTH_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "$HEALTH_URL"; then
              echo ""
              echo "Health check passed."
              exit 0
            fi
            echo "Health check attempt ${attempt} failed; retrying in 15s..."
            sleep 15
          done
          echo "Health check failed after retries: $HEALTH_URL"
          exit 1

      - name: Deploy web to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/web
          output_location: dist
          skip_app_build: true

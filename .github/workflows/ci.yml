name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  install:
    name: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  build-domain:
    name: build domain
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build domain package
        run: |
          rm -rf packages/domain/dist packages/domain/tsconfig.build.tsbuildinfo
          pnpm --filter @proto-platform/domain build

  test-web:
    name: test web
    runs-on: ubuntu-latest
    needs: build-domain
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test web app
        run: pnpm --filter gradera-innovation-hub test

  build-web:
    name: build web
    runs-on: ubuntu-latest
    needs: test-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter gradera-innovation-hub build

  test-api:
    name: test api
    runs-on: ubuntu-latest
    needs: build-domain
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build domain package
        run: |
          rm -rf packages/domain/dist packages/domain/tsconfig.build.tsbuildinfo
          pnpm --filter @proto-platform/domain build

      - name: Generate Prisma Client
        run: pnpm --filter gradera-api exec prisma generate

      - name: Test API
        run: pnpm --filter gradera-api test

  build-api:
    name: build api
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build domain package
        run: |
          rm -rf packages/domain/dist packages/domain/tsconfig.build.tsbuildinfo
          pnpm --filter @proto-platform/domain build

      - name: Generate Prisma Client
        run: pnpm --filter gradera-api exec prisma generate

      - name: Build API
        run: pnpm --filter gradera-api build

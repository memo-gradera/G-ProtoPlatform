# Automatic API deployment to Azure App Service (dev).
#
# Builds and pushes memogradera/gradera-api:<sha>, pins App Service to that exact tag,
# restarts, and verifies /health commit_sha.
#
# Required GitHub secrets (dev environment):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID — OIDC (Contributor on dev RG)
#
# Required GitHub variables (dev environment):
#   AZURE_WEBAPP_NAME — gradera-innovationhub-dev-api
#   AZURE_RESOURCE_GROUP — gradera-innovationhub-dev-rg
#   VITE_API_BASE_URL — public API base URL (used to derive /health)

name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/domain/**'
      - 'packages/contracts/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '22'
  DOCKER_IMAGE: memogradera/gradera-api
  APP_VERSION: '0.1.0'

jobs:
  deploy-api:
    name: Build, push, and deploy API
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build domain package
        run: |
          rm -rf packages/domain/dist packages/domain/tsconfig.build.tsbuildinfo
          pnpm --filter @proto-platform/domain build

      - name: Generate Prisma Client
        run: pnpm --filter gradera-api exec prisma generate

      - name: Test API
        run: pnpm --filter gradera-api test

      - name: Build domain package for API
        run: pnpm --filter @proto-platform/domain build

      - name: Generate Prisma Client for API build
        run: pnpm --filter gradera-api exec prisma generate

      - name: Build API
        run: pnpm --filter gradera-api build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            APP_VERSION=${{ env.APP_VERSION }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm Docker manifest exists
        run: |
          docker buildx imagetools inspect "${{ env.DOCKER_IMAGE }}:${{ github.sha }}"

      - name: Verify Azure OIDC secrets
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Configure AZURE_CLIENT_ID, AZURE_TENANT_ID, and AZURE_SUBSCRIPTION_ID"
            echo "on the dev environment before automatic API deployment can update App Service."
            exit 1
          fi
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point App Service at exact SHA image
        run: |
          set -euo pipefail
          IMAGE="${{ env.DOCKER_IMAGE }}:${{ github.sha }}"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          APP="${{ vars.AZURE_WEBAPP_NAME }}"

          if ! az webapp config container set \
            --resource-group "$RG" \
            --name "$APP" \
            --container-image-name "$IMAGE" \
            --container-registry-url "https://index.docker.io"; then
            echo ""
            echo "::error::Failed to update App Service container image."
            echo "GitHub service principal needs Contributor on ${RG} to run az webapp config container set."
            echo ""
            echo "Until RBAC is granted, deploy manually from a machine with Azure CLI:"
            echo "  az webapp config container set \\"
            echo "    --resource-group ${RG} \\"
            echo "    --name ${APP} \\"
            echo "    --container-image-name ${IMAGE} \\"
            echo "    --container-registry-url https://index.docker.io"
            echo "  az webapp restart --resource-group ${RG} --name ${APP}"
            exit 1
          fi

          echo "App Service container image set to ${IMAGE}"

      - name: Restart App Service
        run: |
          az webapp restart \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}"

      - name: Verify API health endpoint
        run: |
          set -euo pipefail
          API_BASE_URL="${{ vars.VITE_API_BASE_URL }}"
          API_BASE_URL="${API_BASE_URL%/}"
          HEALTH_URL="${API_BASE_URL%/api}/health"
          EXPECTED_SHA="${{ github.sha }}"

          echo "Health URL: ${HEALTH_URL}"
          echo "Expected commit SHA: ${EXPECTED_SHA}"

          for attempt in $(seq 1 12); do
            RESPONSE="$(curl --silent --show-error "$HEALTH_URL" || true)"
            if [ -n "$RESPONSE" ]; then
              echo "Health response (attempt ${attempt}):"
              echo "$RESPONSE"

              if echo "$RESPONSE" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
                if echo "$RESPONSE" | grep -q '"commit_sha"'; then
                  if echo "$RESPONSE" | grep -q "$EXPECTED_SHA"; then
                    echo ""
                    echo "Health check passed with expected commit_sha."
                    exit 0
                  fi
                  echo "::error::Health commit_sha does not match ${EXPECTED_SHA}."
                  exit 1
                fi
                echo "::warning::Health ok but commit_sha missing — image may be stale or build metadata not deployed yet."
                exit 0
              fi
            fi
            echo "Health check attempt ${attempt} not ready; retrying in 15s..."
            sleep 15
          done

          echo "::error::Health check failed after retries: ${HEALTH_URL}"
          exit 1

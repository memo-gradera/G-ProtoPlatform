# Deploy frontend to Azure Static Web App (gradera-innovationhub-dev-web).
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   AZURE_STATIC_WEB_APPS_API_TOKEN — SWA deployment token (Portal → Static Web App → Manage deployment token)
#
# Required GitHub variables (repository or "dev" environment):
#   VITE_AZURE_TENANT_ID   — Entra tenant ID for MSAL
#   VITE_AZURE_CLIENT_ID   — Entra SPA app registration client ID
#   VITE_API_SCOPE         — API scope, e.g. api://<api-client-id>/access_as_user
#   VITE_API_BASE_URL      — Public API URL, e.g. https://gradera-innovationhub-dev-api.azurewebsites.net/api

name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  deploy-web:
    name: Build and deploy web
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        working-directory: apps/web
        env:
          VITE_AUTH_PROVIDER: msal
          VITE_BACKEND_PROVIDER: api
          VITE_DEV_AUTH_BYPASS: 'false'
          VITE_DEV_DATA_BYPASS: 'false'
          VITE_AZURE_TENANT_ID: ${{ vars.VITE_AZURE_TENANT_ID }}
          VITE_AZURE_CLIENT_ID: ${{ vars.VITE_AZURE_CLIENT_ID }}
          VITE_API_SCOPE: ${{ vars.VITE_API_SCOPE }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Copy Static Web App config into build output
        run: cp apps/web/staticwebapp.config.json apps/web/dist/

      - name: Debug dist artifact
        run: |
          echo "Dist file count:"
          find apps/web/dist -type f | wc -l
          echo "Dist size:"
          du -sh apps/web/dist

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/web/dist
          output_location: ''
          skip_app_build: true
